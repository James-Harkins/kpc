name: Weekly Bed Availability Emails

on:
  schedule:
    - cron: '0 14 * * 1'  # Mondays at 2pm UTC; the rake task no-ops if registration is closed, no beds are entered, or the house is full
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - log without sending any emails'
        required: false
        default: 'false'
        type: boolean

jobs:
  send_availability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Run bed availability task
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          fly machine run . \
            --app kpc \
            --rm \
            --restart no \
            --env DRY_RUN=${{ github.event.inputs.dry_run || 'false' }} \
            -- bin/rails emails:send_bed_availability
